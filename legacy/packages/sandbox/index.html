<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XTC Toaster — Compositions</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --panel: #fff;
        --border: #e0e0e0;
        --accent: #1a73e8;
        --text: #1a1a1a;
        --dim: #888;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 13px;
      }
      [data-theme="dark"] {
        --bg: #111;
        --panel: #1a1a1a;
        --border: #2e2e2e;
        --accent: #4a90d9;
        --text: #e0e0e0;
        --dim: #555;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100vh; background: var(--bg); color: var(--text); }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 32px;
        height: 48px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--dim);
        flex: 1;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
        color: var(--dim);
        background: none;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 10px;
        transition: border-color .15s, color .15s;
      }
      .toggle:hover { border-color: var(--accent); color: var(--text); }

      main { padding: 24px 32px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        transition: border-color .15s, box-shadow .15s;
        text-decoration: none;
        display: block;
        color: inherit;
      }
      .card:hover {
        border-color: var(--accent);
        box-shadow: 0 2px 12px color-mix(in srgb, var(--accent) 15%, transparent);
      }

      .preview {
        width: 100%;
        overflow: hidden;
        background: #000;
      }
      .preview iframe {
        width: 300px;
        height: 400px;
        border: none;
        display: block;
        transform-origin: top left;
        pointer-events: none;
      }

      .label {
        padding: 8px 10px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--dim);
        letter-spacing: .04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Compositions</h1>
      <button class="toggle" id="themeToggle">☀ Light</button>
    </header>

    <main>
      <div class="grid" id="grid"></div>
    </main>

    <script type="module">
      const compositions = [
        { id: 1, label: "Composition 1 — RGB channels" },
        { id: 2, label: "Composition 2 — Hue noise (animated)" },
        { id: 3, label: "Composition 3 — RGB additive blend" },
        { id: 4, label: "Composition 4 — Skew transform" },
        { id: 5, label: "Composition 5 — Value sweep (animated)" },
        { id: 6, label: "Composition 6 — Hue noise v2 (animated)" },
      ];

      // --- theme toggle ---
      const html = document.documentElement;
      const btn = document.getElementById("themeToggle");
      const saved = localStorage.getItem("theme") ?? "light";
      setTheme(saved);

      btn.addEventListener("click", () =>
        setTheme(html.dataset.theme === "light" ? "dark" : "light")
      );

      function setTheme(t) {
        html.dataset.theme = t;
        btn.textContent = t === "light" ? "☀ Light" : "☾ Dark";
        localStorage.setItem("theme", t);
      }

      // --- gallery ---
      const grid = document.getElementById("grid");

      function scaleIframe(card) {
        const preview = card.querySelector(".preview");
        const iframe = card.querySelector("iframe");
        const scale = preview.clientWidth / 300;
        iframe.style.transform = `scale(${scale})`;
        preview.style.height = `${400 * scale}px`;
      }

      compositions.forEach(({ id, label }) => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `./compositions/composition-${id}/index.html`;
        a.target = "_blank";
        a.innerHTML = `
          <div class="preview">
            <iframe src="./compositions/composition-${id}/index.html"
                    title="${label}"
                    loading="lazy"
                    scrolling="no"></iframe>
          </div>
          <div class="label">${label}</div>
        `;
        grid.appendChild(a);
        scaleIframe(a);
      });

      window.addEventListener("resize", () =>
        document.querySelectorAll(".card").forEach(scaleIframe)
      );
    </script>
  </body>
</html>
